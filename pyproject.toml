[project]
name = "harness"
version = "0.1.0"
description = "Single-process local coding agent harness with event sourcing, resume, replay and policy-gated side effects."
requires-python = ">=3.12"
dependencies = [
    "litellm[mcp]",  # 1.108 起 completion 路径会 import mcp，缺 extra 直接 ModuleNotFoundError
    "pydantic>=2.7",
    "typer",
    "rich",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[project.optional-dependencies]
msb = ["microsandbox"]
tokenizer = ["tiktoken>=0.7"]  # 可选：精确 token 计数；没装时回退 chars/ratio
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
h = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.sdist]
include = [
    "harness",
    "tests",
    "examples",
    "evals",
    "deploy",
    "docs",
    "README.md",
    "pyproject.toml",
    "harness.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["evals", "deploy", "dist", "docs", "node_modules", "build", "pytest-cache-files-*", "tmp*", ".*"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer 的 Option(...) 就是要写在默认值里

[tool.ruff.lint.isort]
known-first-party = ["harness", "_helpers"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["examples", "tests", "evals"]
