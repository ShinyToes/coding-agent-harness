name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check harness tests examples evals
      - name: Type check
        run: uv run mypy harness
      - name: Tests
        run: uv run pytest -q
      - name: Eval baselines must be red
        run: uv run python evals/run.py --offline
      - name: Offline demo
        run: uv run python examples/demo.py
